name: Unreal Agent PR review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: ianchov/unreal-agent-pr-review/.github/workflows/review.yml@v1
    # Every secret of the repository reaches the review. The review uses the key of the provider that
    # UNREAL_AGENT_PROVIDER or the provider input names, or else the first key that exists.
    secrets: inherit
