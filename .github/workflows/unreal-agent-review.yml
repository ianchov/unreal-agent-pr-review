name: Unreal Agent PR review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: ./.github/workflows/review.yml
    with:
      diff-exclude: .github/workflows
    # The three provider keys by name, not `secrets: inherit`, so no other secret leaves this
    # repository. A key that does not exist arrives empty. The review uses the provider that
    # UNREAL_AGENT_PROVIDER or the provider input names, or else the first key that exists.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
