name: Unreal Agent PR review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: ianchov/unreal-agent-pr-review/.github/workflows/review.yml@v1
    # All three keys, so the variable UNREAL_AGENT_PROVIDER can switch the provider without an edit here.
    # Only the chosen provider's key is used; a secret that does not exist is passed as empty.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
