name: Unreal Agent PR review (reusable)
# Called from a pull_request workflow. The review logic lives in ianchov/unreal-agent-pr-review-action.
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels as JSON, for example '"ubuntu-24.04"' or '["self-hosted","linux"]'.
        type: string
        default: '"ubuntu-24.04"'
      model:
        description: Anthropic model for the agent and the reviewer check.
        type: string
        default: claude-sonnet-5-5
      max-review-rounds:
        description: Most agent and reviewer-check rounds per run.
        type: number
        default: 3
      review-timeout-minutes:
        description: Time limit for all review rounds.
        type: number
        default: 40
      diff-exclude:
        description: Extra paths to leave out of the diff, one git pathspec per line.
        type: string
        default: ""
      adversarial-review:
        description: Also run the adversarial review after the standard review and post it as a second comment. It leaves out the defects the standard review reports.
        type: boolean
        default: true
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  review:
    # Skip before a runner starts: drafts still change, and fork and Dependabot PRs get no secrets.
    # The action skips the same PRs for workflows that use it directly.
    if: >-
      github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: unreal-agent-review-${{ github.event.pull_request.number }}-standard
      cancel-in-progress: true
    steps:
      - uses: ianchov/unreal-agent-pr-review-action@feature/dedupe-reviews
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ inputs.model }}
          max-review-rounds: ${{ inputs.max-review-rounds }}
          review-timeout-minutes: ${{ inputs.review-timeout-minutes }}
          diff-exclude: ${{ inputs.diff-exclude }}

  adversarial:
    # Runs after the standard review and gets it as prior-review, so it reports only what that review missed.
    # It also runs after a failed standard review, then without it. A skipped or cancelled one skips it.
    needs: review
    if: >-
      !cancelled() && inputs.adversarial-review
      && (needs.review.result == 'success' || needs.review.result == 'failure')
    name: adversarial review
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: unreal-agent-review-${{ github.event.pull_request.number }}-adversarial
      cancel-in-progress: true
    steps:
      # The standard job uploads its review as this artifact. Without it, the review runs without prior-review.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: unreal-agent-review-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/standard-review
      - uses: ianchov/unreal-agent-pr-review-action@feature/dedupe-reviews
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ inputs.model }}
          max-review-rounds: ${{ inputs.max-review-rounds }}
          review-timeout-minutes: ${{ inputs.review-timeout-minutes }}
          diff-exclude: ${{ inputs.diff-exclude }}
          review-mode: adversarial
          prior-review: ${{ runner.temp }}/standard-review/review.md
