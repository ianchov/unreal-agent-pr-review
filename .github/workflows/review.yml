name: Unreal Agent PR review (reusable)
# Called from a pull_request workflow. The review logic lives in ianchov/unreal-agent-pr-review-action.
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels as JSON, for example '"ubuntu-24.04"' or '["self-hosted","linux"]'.
        type: string
        default: '"ubuntu-24.04"'
      provider:
        description: 'Model provider: "anthropic", "openai", or "openrouter". The repository or organization variable UNREAL_AGENT_PROVIDER, when set, takes precedence. When neither is set, the first passed key decides: anthropic, then openrouter, then openai.'
        type: string
        default: ""
      model:
        description: Model for the agent and the reviewer check. The repository or organization variable UNREAL_AGENT_MODEL, when set, takes precedence. Defaults to claude-sonnet-5-5 for anthropic and openai/gpt-6-sol for openrouter; required for openai.
        type: string
        default: ""
      max-review-rounds:
        description: Most agent and reviewer-check rounds per run.
        type: number
        default: 3
      review-timeout-minutes:
        description: Time limit for all review rounds.
        type: number
        default: 40
      diff-exclude:
        description: Extra paths to leave out of the diff, one git pathspec per line.
        type: string
        default: ""
      adversarial-review:
        description: Also run the adversarial review after the standard review when it has no P0 or P1 finding, and post it as a second comment. It leaves out the defects the standard review reports.
        type: boolean
        default: true
      skip-renovate:
        description: Skip pull requests opened by Renovate (renovate[bot]).
        type: boolean
        default: true
    secrets:
      ANTHROPIC_API_KEY:
        description: Key for provider anthropic.
        required: false
      OPENAI_API_KEY:
        description: Key for provider openai.
        required: false
      OPENROUTER_API_KEY:
        description: Key for provider openrouter.
        required: false

# The provider both jobs use: the variable, then the input, then the first key the caller passed, in
# a fixed order. A caller that passes all three keys by name only needs to add a key as a secret.
env:
  REVIEW_PROVIDER: >-
    ${{ vars.UNREAL_AGENT_PROVIDER || inputs.provider
    || (secrets.ANTHROPIC_API_KEY != '' && 'anthropic')
    || (secrets.OPENROUTER_API_KEY != '' && 'openrouter')
    || (secrets.OPENAI_API_KEY != '' && 'openai')
    || 'anthropic' }}

jobs:
  review:
    # Skip before a runner starts: drafts still change, fork and Dependabot PRs get no secrets, and
    # Renovate PRs (unless skip-renovate is false) only bump pinned versions.
    # The action skips the same PRs for workflows that use it directly.
    if: >-
      github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && (!inputs.skip-renovate || github.event.pull_request.user.login != 'renovate[bot]')
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: unreal-agent-review-${{ github.event.pull_request.number }}-standard
      cancel-in-progress: true
    outputs:
      verdict: ${{ steps.review.outputs.verdict }}
      highest-severity: ${{ steps.review.outputs.highest-severity }}
    steps:
      - id: review
        uses: ianchov/unreal-agent-pr-review-action@v1
        with:
          provider: ${{ env.REVIEW_PROVIDER }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          model: ${{ vars.UNREAL_AGENT_MODEL || inputs.model }}
          skip-renovate: ${{ inputs.skip-renovate }}
          max-review-rounds: ${{ inputs.max-review-rounds }}
          review-timeout-minutes: ${{ inputs.review-timeout-minutes }}
          diff-exclude: ${{ inputs.diff-exclude }}

  adversarial:
    # Runs after the standard review and gets it as prior-review, so it reports only what that review missed.
    # It reviews only when the standard review gave a verdict and found no P0 or P1 defect: with a serious
    # defect still to fix, a second review is not worth its cost. P2 and P3 findings do not block it.
    # Otherwise skip-reason marks its old comment as not reviewed for this commit (the runner starts only
    # for that note). A skipped or cancelled standard review skips it.
    needs: review
    if: >-
      !cancelled() && inputs.adversarial-review
      && (needs.review.result == 'success' || needs.review.result == 'failure')
    name: adversarial review
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: unreal-agent-review-${{ github.event.pull_request.number }}-adversarial
      cancel-in-progress: true
    steps:
      # The standard job uploads its review as this artifact. Without it, the review runs without prior-review.
      - if: >-
          needs.review.outputs.verdict != ''
          && !contains(fromJSON('["P0","P1"]'), needs.review.outputs.highest-severity)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: unreal-agent-review-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/standard-review
      - uses: ianchov/unreal-agent-pr-review-action@v1
        with:
          provider: ${{ env.REVIEW_PROVIDER }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          model: ${{ vars.UNREAL_AGENT_MODEL || inputs.model }}
          skip-renovate: ${{ inputs.skip-renovate }}
          max-review-rounds: ${{ inputs.max-review-rounds }}
          review-timeout-minutes: ${{ inputs.review-timeout-minutes }}
          diff-exclude: ${{ inputs.diff-exclude }}
          review-mode: adversarial
          prior-review: ${{ runner.temp }}/standard-review/review.md
          skip-reason: >-
            ${{ needs.review.outputs.verdict == '' && 'the standard review gave no verdict'
            || contains(fromJSON('["P0","P1"]'), needs.review.outputs.highest-severity)
              && format('the standard review found a {0} defect', needs.review.outputs.highest-severity)
            || '' }}
