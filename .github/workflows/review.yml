name: Unreal Agent PR review (reusable)
# Called from a pull_request workflow. The review logic lives in ianchov/unreal-agent-pr-review-action.
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels as JSON, for example '"ubuntu-24.04"' or '["self-hosted","linux"]'.
        type: string
        default: '"ubuntu-24.04"'
      provider:
        description: 'Model provider: "anthropic", "openai", or "openrouter". Pass the matching secret.'
        type: string
        default: anthropic
      model:
        description: Model for the agent and the reviewer check. Defaults to claude-sonnet-5-5 for anthropic and openai/gpt-6-sol for openrouter; required for openai.
        type: string
        default: ""
      max-review-rounds:
        description: Most agent and reviewer-check rounds per run.
        type: number
        default: 3
      review-timeout-minutes:
        description: Time limit for all review rounds.
        type: number
        default: 40
      diff-exclude:
        description: Extra paths to leave out of the diff, one git pathspec per line.
        type: string
        default: ""
      adversarial-review:
        description: Also run the adversarial review after the standard review says "Ready to merge", and post it as a second comment. It leaves out the defects the standard review reports.
        type: boolean
        default: true
      skip-renovate:
        description: Skip pull requests opened by Renovate (renovate[bot]).
        type: boolean
        default: true
    secrets:
      ANTHROPIC_API_KEY:
        description: Key for provider anthropic.
        required: false
      OPENAI_API_KEY:
        description: Key for provider openai.
        required: false
      OPENROUTER_API_KEY:
        description: Key for provider openrouter.
        required: false

jobs:
  review:
    # Skip before a runner starts: drafts still change, fork and Dependabot PRs get no secrets, and
    # Renovate PRs (unless skip-renovate is false) only bump pinned versions.
    # The action skips the same PRs for workflows that use it directly.
    if: >-
      github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && (!inputs.skip-renovate || github.event.pull_request.user.login != 'renovate[bot]')
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: unreal-agent-review-${{ github.event.pull_request.number }}-standard
      cancel-in-progress: true
    outputs:
      verdict: ${{ steps.review.outputs.verdict }}
    steps:
      - id: review
        uses: ianchov/unreal-agent-pr-review-action@feature/python-logic
        with:
          provider: ${{ inputs.provider }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          model: ${{ inputs.model }}
          skip-renovate: ${{ inputs.skip-renovate }}
          max-review-rounds: ${{ inputs.max-review-rounds }}
          review-timeout-minutes: ${{ inputs.review-timeout-minutes }}
          diff-exclude: ${{ inputs.diff-exclude }}

  adversarial:
    # Runs after the standard review and gets it as prior-review, so it reports only what that review missed.
    # It reviews only when the standard verdict is "Ready to merge": with changes still to make, a second
    # review is not worth its cost. Otherwise skip-reason marks its old comment as not reviewed for this
    # commit (the runner starts only for that note). A skipped or cancelled standard review skips it.
    needs: review
    if: >-
      !cancelled() && inputs.adversarial-review
      && (needs.review.result == 'success' || needs.review.result == 'failure')
    name: adversarial review
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: unreal-agent-review-${{ github.event.pull_request.number }}-adversarial
      cancel-in-progress: true
    steps:
      # The standard job uploads its review as this artifact. Without it, the review runs without prior-review.
      - if: needs.review.outputs.verdict == 'Ready to merge'
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: unreal-agent-review-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/standard-review
      - uses: ianchov/unreal-agent-pr-review-action@feature/python-logic
        with:
          provider: ${{ inputs.provider }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          model: ${{ inputs.model }}
          skip-renovate: ${{ inputs.skip-renovate }}
          max-review-rounds: ${{ inputs.max-review-rounds }}
          review-timeout-minutes: ${{ inputs.review-timeout-minutes }}
          diff-exclude: ${{ inputs.diff-exclude }}
          review-mode: adversarial
          prior-review: ${{ runner.temp }}/standard-review/review.md
          skip-reason: >-
            ${{ needs.review.outputs.verdict != 'Ready to merge'
            && (needs.review.outputs.verdict != ''
              && format('the standard review asks for changes ({0})', needs.review.outputs.verdict)
              || 'the standard review gave no verdict')
            || '' }}
