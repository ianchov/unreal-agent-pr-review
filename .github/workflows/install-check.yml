name: Install check
# Runs scripts/install.sh from the action version that review.yml uses, on both architectures.
# This catches a moved tag or changed release files before users of the reusable workflow hit them.
# It runs on every PR because it is a required check: a path filter would leave PRs waiting forever.
# Repositories created from this template skip it.
on:
  pull_request:

permissions:
  contents: read

jobs:
  install:
    if: github.repository == 'ianchov/unreal-agent-pr-review'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: action
        name: Read action version from review.yml
        run: |
          refs=$(grep -oE 'ianchov/unreal-agent-pr-review-action@[^[:space:]]+' .github/workflows/review.yml || true)
          [ "$(printf '%s\n' "$refs" | grep -c .)" -eq 1 ] || { echo "::error::Expected one action reference in review.yml, got: $refs"; exit 1; }
          echo "ref=${refs#*@}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ianchov/unreal-agent-pr-review-action
          ref: ${{ steps.action.outputs.ref }}
          path: action
          persist-credentials: false
      - run: bash action/scripts/install.sh
      - run: |
          nono --version
          test -x "$RUNNER_TEMP/unreal-agent-bin/unreal-agent-runner"
